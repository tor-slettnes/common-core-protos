// -*- protocol-buffers -*-
//==============================================================================
/// @file demo_types.proto
/// @brief data types used in Demo application
/// @author Tor Slettnes
//==============================================================================

syntax = "proto3";

package cc.demo.grpc;

import "google/protobuf/empty.proto";
import "cc/protobuf/version/version.proto";
import "cc/protobuf/signal/signal.proto";
import "cc/demo/protobuf/demo_types.proto";

//==============================================================================
// Service

// Simple service to showcase command/response and event propagation
service Demo {
    // Check server presence and API level.
    rpc ServiceCheck (google.protobuf.Empty)
        returns (ServiceCheckResponse);

    // Send a greeting to other listeners
    rpc SayHello (cc.demo.protobuf.Greeting)
        returns (google.protobuf.Empty);

    // Get the current time
    rpc GetCurrentTime (google.protobuf.Empty)
        returns (cc.demo.protobuf.TimeData);

    // Start streaing time updates at regular intervals
    rpc StartTicking (google.protobuf.Empty)
        returns (google.protobuf.Empty);

    // Stop streaming time updates
    rpc StopTicking (google.protobuf.Empty)
        returns (google.protobuf.Empty);

    // Stream signals from the server
    rpc Watch (cc.protobuf.signal.Filter)
        returns (stream cc.demo.protobuf.Signal);

}

// We define the `ServiceCheckResponse` type here so that at least one message
// type is colocated in the same `.proto` file as the gRPC service, above.  This
// is to work around an issue in Go-based introspection tools (such as
// `grpc-ui`), which fail to query for reflection information from the server if
// a .proto file contains only services and zero message definitions.

message ServiceCheckResponse
{
    // API level. The client may compare this with `APILEVEL_CURRENT` below to
    // check interface compatibility.
    uint64 api_level = 1;

    // Server application name
    string server_name = 2;

    // Software version running on server.
    cc.protobuf.version.Version server_version = 3;
}


enum APILevel
{
    APILEVEL_NONE    = 0;   // Enum sentinel
    APILEVEL_CURRENT = 1;   // Increment this if breaking changes are introduced
}
